[project]
name = "neural-decoding-ml"
version = "0.1.0"
description = "Thesis codebase for neural decoding of mouse spatial position from piriform and hippocampal recordings."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Facundo Montiel", email = "ingfacundomontiel@gmail.com" },
]

dependencies = [
    # Core library — audited/extended fork of ibioml, local editable install
    "ibioml[optuna]",
    # torch is split by platform:
    # - Intel macOS: pin to 2.2.x (last release with x86_64 macOS wheels;
    #   dropped in 2.3+). Remove when we move to Apple Silicon.
    # - Linux GPU hosts: 2.6+ ships kernels for Blackwell (sm_120, RTX 50xx);
    #   2.2 only covers up to Hopper (sm_90).
    "torch>=2.2,<2.3 ; sys_platform == 'darwin'",
    "torch>=2.6 ; sys_platform == 'linux'",
    # numpy pairs with the torch version:
    # - torch 2.2 was compiled against numpy 1.x — numpy 2.x can crash.
    # - torch 2.6+ works natively with numpy 2.x.
    "numpy<2 ; sys_platform == 'darwin'",
    "numpy ; sys_platform == 'linux'",
    # Notebook tooling (Jupytext-paired .py + .ipynb workflow)
    "jupyterlab>=4.0",
    "jupytext>=1.16",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv.sources]
ibioml = { path = "external/ibioml", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit security
    "N",            # pep8-naming
]
ignore = [
    "S101", # assert used — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"exploration/**/*.py" = ["E402"] # allow imports below jupytext headers

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
